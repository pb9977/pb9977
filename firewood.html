<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firewood Splitter Diorama</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #faf8f3; }
  body { display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #view { display: block; width: min(640px, 100vw, 100vh); aspect-ratio: 1 / 1; height: auto; }
  #rec {
    position: fixed; top: 12px; right: 12px; display: none; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; background: #1c2541; color: #fff;
    font: 600 12px/1.4 system-ui, sans-serif; letter-spacing: .08em;
  }
  #rec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view" width="640" height="640"></canvas>
<div id="rec">REC</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- constants (1 unit = 1 metre)
const SIZE = 640;
const L = 72;                 // loop length (s)
const BUILD_END = 1, LIVE_END = L - 1;
const POP = 0.35;
const MAX_DELAY = BUILD_END - POP;

const NLOG = 30, SEGS = 3, HALVES = 2;
const NPIECE = NLOG * SEGS * HALVES;            // 180 split pieces (each chop splits a third in two)
const T0 = 1, PC = 2.3;                          // first pick-up, seconds per log
const LOG_D = 0.16;
const SOLID = Math.PI * (LOG_D / 2) ** 2 * 1;    // m³ per 1 m log
const STACKED_M3 = NLOG * SOLID * 1.5;           // 1 m logs, stacked  (≈ 1.5 × solid)
const LOOSE_M3 = NLOG * SOLID * 2.5;             // split, loose pile  (≈ 2.5 × solid)

const C = {
  offWhite: 0xf3efe6, paper: 0xfaf8f3,
  blue: 0x2f52c9, blueDeep: 0x203a96, teal: 0x17a3a0, tealDeep: 0x0f7d7c,
  green: 0x3fae5e, greenDeep: 0x2b8a4a, orange: 0xff7a1a,
  navy: 0x1c2541, mfRed: 0xc8172d, steel: 0x8e959e, tyre: 0x24272e,
  birch: 0xece6d8, wood: 0xe3c48f, woodDark: 0xc9a46b, skin: 0xe8b98f,
};

// ---------------------------------------------------------------- helpers
function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(165);
const rr = (a, b) => a + (b - a) * rand();

const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const smoothstep = (a, b, x) => smooth((x - a) / (b - a));
const bump = (a, b, x) => Math.sin(Math.PI * clamp01((x - a) / (b - a)));
const lerp = (a, b, u) => a + (b - a) * u;
const backOut = (u) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * (u - 1) ** 3 + c1 * (u - 1) ** 2; };
const TAU = Math.PI * 2;
const faceY = (hx, hz) => Math.atan2(hx, hz);   // a figure's local +z faces (hx, hz)

function envelope(t, delay) {
  const u = clamp01((t - delay) / POP);
  const v = clamp01((t - (LIVE_END + (MAX_DELAY - delay))) / POP);
  const s = backOut(u) * (1 - v * v);
  return { s: Math.max(0, s), dy: -0.6 * (1 - u) ** 2 - 1.2 * v * v };
}

const geoCache = new Map();
function RB(w, h, d, r = 0.04) {
  r = Math.min(r, w / 2 - 1e-3, h / 2 - 1e-3, d / 2 - 1e-3);
  const key = [w, h, d, r].map((n) => n.toFixed(4)).join('|');
  if (!geoCache.has(key)) geoCache.set(key, new RoundedBoxGeometry(w, h, d, 3, r));
  return geoCache.get(key);
}
const matCache = new Map();
function MAT(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0, ...opts }));
  return matCache.get(key);
}

const _e = new THREE.Euler(), _q = new THREE.Quaternion(), _v = new THREE.Vector3(), _s = new THREE.Vector3();
function TRS(x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1, out = new THREE.Matrix4()) {
  return out.compose(_v.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz)), _s.set(sx, sy, sz));
}
const _om = new THREE.Matrix4();
function pivot(out, px, py, pz, rx, ry, rz, ox, oy, oz) {
  TRS(px, py, pz, rx, ry, rz, 1, 1, 1, out);
  return out.multiply(_om.makeTranslation(ox, oy, oz));
}

// ---------------------------------------------------------------- renderer
const view = document.getElementById('view');
const ctx = view.getContext('2d');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
// The page colour must survive ACES tone mapping, so solve for the linear input that maps onto it.
function acesInverse(hex) {
  const target = new THREE.Color(hex);
  const fit = (v) => (v * (v + 0.0245786) - 0.000090537) / (v * (0.983729 * v + 0.432951) + 0.238081);
  const aces = ([r, g, b]) => {
    const k = renderer.toneMappingExposure / 0.6; r *= k; g *= k; b *= k;
    const i = [0.59719 * r + 0.35458 * g + 0.04823 * b, 0.076 * r + 0.90834 * g + 0.01566 * b, 0.0284 * r + 0.13383 * g + 0.83777 * b].map(fit);
    return [1.60475 * i[0] - 0.53108 * i[1] - 0.07367 * i[2], -0.10208 * i[0] + 1.10813 * i[1] - 0.00605 * i[2], -0.00327 * i[0] - 0.07276 * i[1] + 1.07602 * i[2]];
  };
  const want = [target.r, target.g, target.b], x = [1, 1, 1];
  for (let it = 0; it < 200; it++) {
    const y = aces(x);
    for (let c = 0; c < 3; c++) {
      const xp = x.slice(); xp[c] *= 1.001;
      const dy = (aces(xp)[c] - y[c]) / (x[c] * 0.001);
      x[c] = Math.max(1e-4, x[c] + (want[c] - y[c]) / dy);
    }
  }
  return new THREE.Color(...x);
}
scene.background = acesInverse(C.paper);
const camera = new THREE.PerspectiveCamera(22, 1, 1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c4, 1.5));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.6);
sun.position.set(-14, 26, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 4;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// ---------------------------------------------------------------- piece systems
const groups = [];
function addGroup(obj, delay, x = 0, y = 0, z = 0, ry = 0, wobble = null) {
  obj.position.set(x, y, z); obj.rotation.y = ry;
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(obj);
  groups.push({ obj, delay: Math.min(MAX_DELAY, delay), y, wobble });
}
function mesh(geo, color, x, y, z, rx = 0, ry = 0, rz = 0, opts) {
  const m = new THREE.Mesh(geo, MAT(color, opts));
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
  return m;
}
// Octagonal disc from four rounded bars (axis along local z) – reads as a wheel.
function octo(D, W, color, x, y, z, ry = 0) {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) g.add(mesh(RB(D, D * 0.4142, W, Math.min(0.08, W / 2)), color, 0, 0, 0, 0, 0, i * Math.PI / 4));
  g.position.set(x, y, z); g.rotation.y = ry;
  return g;
}

const kinds = [];
class Kind {
  constructor(parts, cap) {
    this.parts = parts; this.items = [];
    this.meshes = parts.map((p) => {
      const im = new THREE.InstancedMesh(p.geo, p.color === 'inst' ? MAT(0xffffff, p.opts) : MAT(p.color, p.opts), cap);
      im.castShadow = p.shadow !== false; im.receiveShadow = true; im.frustumCulled = false;
      im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(im); return im;
    });
    kinds.push(this);
  }
  add(delay, pose, colors = {}) {
    const i = this.items.length;
    this.items.push({ delay: Math.min(MAX_DELAY, delay), pose: typeof pose === 'function' ? pose : () => pose });
    this.parts.forEach((p, k) => { if (p.color === 'inst') this.meshes[k].setColorAt(i, new THREE.Color(colors[p.slot] ?? 0xffffff)); });
    return i;
  }
  finalize() { this.meshes.forEach((m) => { m.count = this.items.length; if (m.instanceColor) m.instanceColor.needsUpdate = true; }); }
}
const _base = new THREE.Matrix4(), _local = new THREE.Matrix4(), _out = new THREE.Matrix4(), ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
function updateKinds(t) {
  for (const k of kinds) {
    k.items.forEach((it, i) => {
      const env = envelope(t, it.delay);
      const p = it.pose(t);
      const s = env.s * (p.s ?? 1);
      if (s < 1e-3) { k.meshes.forEach((m) => m.setMatrixAt(i, ZERO)); return; }
      TRS(p.x, (p.y ?? 0) + env.dy, p.z, p.rx ?? 0, p.ry ?? 0, p.rz ?? 0, s, s, s, _base);
      k.parts.forEach((part, j) => {
        const loc = typeof part.local === 'function' ? part.local(p, _local) : part.local;
        k.meshes[j].setMatrixAt(i, _out.multiplyMatrices(_base, loc));
      });
    });
    k.meshes.forEach((m) => { m.instanceMatrix.needsUpdate = true; });
  }
}

// ---------------------------------------------------------------- layout
const SCX = -0.4, SCZ = -0.4, HALF = 4.6;         // slab centre & half-size
const TRACTOR = { x: -1.55, z: -0.5 };            // rear axle on the ground, tractor faces -x
const MACH_X = 0.5;                               // feed trough centreline (log is pushed +z)
const SAW_Z = -0.55;                              // cut plane swept by the flywheel blade
const TROUGH = { y: 0.83, z: SAW_Z - 0.5 };       // log centre when laid in the trough
const PILE = { x: 1.95, z: 0.85, R: 1.15 };
PILE.H = 3 * LOOSE_M3 / (Math.PI * PILE.R ** 2);  // cone holding the loose volume
// worker spots: A at the log stack, P beside the trough, B behind the log (pushing from there)
const WORK = { xA: 1.6, zA: -1.65, xP: 1.05, zP: -1.05, xB: MACH_X, zB: SAW_Z - 1 - 0.42 };
const EXHAUST = new THREE.Vector3(TRACTOR.x - 1.55, 2.12, TRACTOR.z - 0.2);

// ---------------------------------------------------------------- slab (always present)
{
  const top = mesh(RB(HALF * 2, 0.5, HALF * 2, 0.24), C.offWhite, SCX, -0.25, SCZ);
  const base = mesh(RB(HALF * 2 - 0.4, 1.0, HALF * 2 - 0.4, 0.4), C.blue, SCX, -1.0, SCZ);
  for (const m of [top, base]) { m.castShadow = m.receiveShadow = true; scene.add(m); }
}
const fitPoints = [];
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  fitPoints.push(new THREE.Vector3(SCX + sx * HALF, -1.5, SCZ + sz * HALF), new THREE.Vector3(SCX + sx * HALF, 2.6, SCZ + sz * HALF));
}
fitPoints.push(EXHAUST.clone().setY(3.9));

// ---------------------------------------------------------------- Massey Ferguson 165
{
  const g = new THREE.Group();
  // rear wheels: tyre + rim + hub
  for (const s of [-1, 1]) {
    g.add(octo(1.36, 0.42, C.tyre, 0, 0.68, s * 0.8));
    g.add(octo(0.78, 0.44, C.steel, 0, 0.68, s * 0.8));
    g.add(mesh(RB(0.22, 0.22, 0.48, 0.05), C.mfRed, 0, 0.68, s * 0.8));
    // fenders
    g.add(mesh(RB(0.95, 0.06, 0.5, 0.025), C.mfRed, -0.02, 1.42, s * 0.8));
    g.add(mesh(RB(0.06, 0.38, 0.5, 0.025), C.mfRed, 0.5, 1.25, s * 0.8, 0, 0, -0.55));
    g.add(mesh(RB(0.06, 0.36, 0.5, 0.025), C.mfRed, -0.53, 1.26, s * 0.8, 0, 0, 0.55));
    // front wheels
    g.add(octo(0.72, 0.2, C.tyre, 1.95, 0.36, s * 0.6));
    g.add(octo(0.4, 0.22, C.steel, 1.95, 0.36, s * 0.6));
    // headlights & footsteps
    g.add(mesh(RB(0.06, 0.12, 0.12, 0.03), C.paper, 2.14, 1.22, s * 0.22, 0, 0, 0, { emissive: 0xfff4dc, emissiveIntensity: 0.4 }));
    g.add(mesh(RB(0.4, 0.04, 0.22, 0.015), C.steel, 0.55, 0.5, s * 0.48));
  }
  g.add(mesh(RB(0.12, 0.12, 1.3, 0.04), C.steel, 1.95, 0.4, 0));                // front axle
  g.add(mesh(RB(0.14, 0.14, 1.66, 0.05), C.steel, 0, 0.68, 0));                 // rear axle
  g.add(mesh(RB(1.75, 0.42, 0.5, 0.08), C.steel, 1.15, 0.78, 0));               // engine block
  g.add(mesh(RB(1.05, 0.55, 0.6, 0.08), C.steel, -0.05, 0.78, 0));              // transmission
  g.add(mesh(RB(1.75, 0.45, 0.64, 0.12), C.mfRed, 1.15, 1.2, 0));               // hood
  g.add(mesh(RB(0.14, 0.72, 0.62, 0.05), C.mfRed, 2.05, 1.04, 0));              // grille surround
  for (let i = 0; i < 4; i++) g.add(mesh(RB(0.03, 0.04, 0.44, 0.012), C.navy, 2.13, 0.84 + i * 0.1, 0));
  g.add(mesh(RB(0.25, 0.26, 0.76, 0.06), C.steel, 2.22, 0.62, 0));             // front weight
  g.add(mesh(RB(0.3, 0.6, 0.66, 0.08), C.mfRed, 0.3, 1.2, 0));                  // dash / cowl
  g.add(mesh(RB(0.06, 0.58, 0.06, 0.02), C.steel, 0.2, 1.5, 0, 0, 0, 0.78));    // steering column
  g.add(mesh(RB(0.38, 0.035, 0.38, 0.015), C.navy, 0.0, 1.72, 0, 0, 0, 0.55));  // steering wheel
  g.add(mesh(RB(0.08, 0.32, 0.08, 0.03), C.steel, -0.25, 1.1, 0));              // seat post
  g.add(mesh(RB(0.4, 0.08, 0.4, 0.04), C.navy, -0.25, 1.28, 0));                // seat
  g.add(mesh(RB(0.06, 0.32, 0.38, 0.03), C.navy, -0.46, 1.44, 0));              // backrest
  g.add(mesh(RB(0.13, 0.36, 0.13, 0.05), C.steel, 1.55, 1.58, 0.2));           // muffler
  g.add(mesh(RB(0.07, 0.42, 0.07, 0.03), C.navy, 1.55, 1.92, 0.2));            // exhaust pipe
  g.add(mesh(RB(0.11, 0.3, 0.11, 0.05), C.offWhite, 1.4, 1.55, -0.2));         // air pre-cleaner
  g.add(mesh(RB(0.24, 0.1, 0.4, 0.03), C.steel, -0.6, 0.45, 0));                // hitch bracket
  addGroup(g, 0.14, TRACTOR.x, 0, TRACTOR.z, Math.PI, (t) => 0.006 * Math.sin(TAU * 600 * t / L));
  for (const x of [-0.35, 2.5]) for (const z of [-0.85, 0.85]) fitPoints.push(new THREE.Vector3(TRACTOR.x - x, 1.8, TRACTOR.z + z));
}
// exhaust rain cap flapping
const rainCap = new Kind([{ geo: RB(0.1, 0.02, 0.1, 0.008), color: C.navy, local: (p, o) => pivot(o, -0.04, 0, 0, 0, 0, p.flap, 0.05, 0.01, 0) }], 1);
rainCap.add(0.5, (t) => ({ x: EXHAUST.x, y: EXHAUST.y, z: EXHAUST.z, ry: 0, flap: 0.15 + 0.35 * Math.abs(Math.sin(TAU * 45 * t / L)) }));
rainCap.finalize();
// smoke from the exhaust: periodic puffs (period 2 s, 30 per loop)
const smoke = new Kind([{ geo: RB(0.36, 0.36, 0.36, 0.17), color: 'inst', slot: 'c', local: new THREE.Matrix4(), shadow: false, opts: { roughness: 1 } }], 12);
for (let i = 0; i < 10; i++) {
  const grey = [0xdcdcdc, 0xc4c6ca, 0xa9adb3, 0xe8e6e1][i % 4];
  smoke.add(0.5, (t) => {
    const u = (t / 2 + i / 10) % 1;
    return {
      x: EXHAUST.x + 0.9 * u * u + 0.05 * Math.sin(u * 9 + i), y: EXHAUST.y + 0.1 + 1.6 * u, z: EXHAUST.z + 0.25 * u * Math.sin(i * 2.3),
      s: (0.25 + 1.6 * u) * Math.pow(Math.sin(Math.PI * u), 0.7), ry: i + u, rx: u * 2,
    };
  }, { c: grey });
}
smoke.finalize();
// PTO shaft between tractor and splitter gearbox
const pto = new Kind([
  { geo: RB(0.58, 0.07, 0.07, 0.02), color: C.steel, local: (p, o) => TRS(0, 0, 0, p.spin, 0, 0, 1, 1, 1, o) },
  { geo: RB(0.08, 0.13, 0.13, 0.03), color: C.orange, local: (p, o) => TRS(-0.27, 0, 0, p.spin, 0, 0, 1, 1, 1, o) },
  { geo: RB(0.08, 0.13, 0.13, 0.03), color: C.orange, local: (p, o) => TRS(0.27, 0, 0, p.spin, 0, 0, 1, 1, 1, o) },
], 1);
pto.add(0.3, (t) => ({ x: -0.7, y: 0.6, z: TRACTOR.z, spin: TAU * 300 * t / L }));
pto.finalize();

// ---------------------------------------------------------------- old-style flywheel chopper: hand-fed, one stroke cuts and splits
{
  const g = new THREE.Group();
  for (const sx of [-1, 1]) {
    for (const z of [-1.65, -0.25]) g.add(mesh(RB(0.1, 0.6, 0.1, 0.03), C.blue, sx * 0.24, 0.3, z));
    g.add(mesh(RB(0.08, 0.1, 1.55, 0.03), C.blue, sx * 0.24, 0.62, -0.95));
    g.add(mesh(RB(0.24, 0.035, 1.1, 0.015), C.teal, sx * 0.11, 0.77, SAW_Z - 0.55, 0, 0, sx * 0.55));  // hand-feed V-trough
    g.add(mesh(RB(0.65, 0.06, 0.06, 0.02), C.steel, -1.175, 0.48, TRACTOR.z + sx * 0.32));             // lower links
  }
  g.add(mesh(RB(0.6, 0.06, 0.06, 0.02), C.steel, -1.15, 1.0, TRACTOR.z));                               // top link
  g.add(mesh(RB(0.34, 0.42, 0.28, 0.06), C.blueDeep, -0.7, 0.68, SAW_Z - 0.26));                        // flywheel bearing / angle gearbox
  g.add(mesh(RB(0.06, 0.06, 0.5, 0.02), C.blue, -0.32, 0.62, SAW_Z - 0.2));
  // guard arching over the top of the flywheel
  for (let i = -2; i <= 2; i++) {
    const a = Math.PI / 2 + i * 0.36;
    g.add(mesh(RB(0.24, 0.05, 0.22, 0.02), C.teal, -0.7 + 0.66 * Math.cos(a), TROUGH.y + 0.66 * Math.sin(a), SAW_Z - 0.09, 0, 0, a - Math.PI / 2));
  }
  g.add(mesh(RB(0.3, 0.3, 0.03, 0.02), C.steel, 0, TROUGH.y, SAW_Z + 0.36));                            // length stop (1/3 m)
  g.add(mesh(RB(0.04, 0.04, 0.4, 0.015), C.steel, 0.17, TROUGH.y, SAW_Z + 0.18));
  g.add(mesh(RB(0.75, 0.03, 0.45, 0.012), C.steel, 0.42, 0.58, SAW_Z + 0.18, 0, 0, -0.45));             // side chute
  addGroup(g, 0.2, MACH_X, 0, 0);
}
// the flywheel with its chopping/splitting blade, spinning off the PTO (2 rev/s)
const flywheel = new Kind([
  ...[0, 1, 2, 3].map((i) => ({ geo: RB(1.1, 1.1 * 0.4142, 0.1, 0.04), color: C.navy, local: (p, o) => TRS(0, 0, 0, 0, 0, p.spin + i * Math.PI / 4, 1, 1, 1, o) })),
  { geo: RB(0.2, 0.2, 0.16, 0.06), color: C.offWhite, local: (p, o) => TRS(0, 0, 0.02, 0, 0, p.spin, 1, 1, 1, o) },
  { geo: RB(0.5, 0.12, 0.03, 0.012), color: C.steel, local: (p, o) => pivot(o, 0, 0, 0.065, 0, 0, p.spin, 0.62, 0, 0) },        // axe blade
  { geo: RB(0.36, 0.03, 0.1, 0.012), color: C.orange, local: (p, o) => pivot(o, 0, 0, 0.1, 0, 0, p.spin, 0.68, 0.0, 0) },     // splitting wedge
], 1);
flywheel.add(0.4, (t) => ({ x: MACH_X - 0.7, y: TROUGH.y, z: SAW_Z - 0.07, spin: -TAU * 144 * t / L }));
flywheel.finalize();

// ---------------------------------------------------------------- schedule (pure functions of t)
// Per log (seconds after pick-up): lift, carry, lay in trough, step behind it, then three pushes of 1/3 m.
const PUSH0 = 0.95, PUSH_GAP = 0.4, PUSH_LEN = 0.2, FLY = 0.55;
const pickT = (k) => T0 + k * PC;
const placeT = (k) => pickT(k) + 0.72;
const pushT = (k, j) => pickT(k) + PUSH0 + PUSH_GAP * j;
const chopT = (k, j) => pushT(k, j) + PUSH_LEN;
const CHOPS = [];
for (let k = 0; k < NLOG; k++) for (let j = 0; j < SEGS; j++) CHOPS.push(chopT(k, j));
const lastBefore = (arr, t) => { let r = -1e9; for (const x of arr) if (x <= t) r = x; else break; return r; };
const feed = (k, t) => { let f = 0; for (let j = 0; j < SEGS; j++) f += smoothstep(pushT(k, j), chopT(k, j), t) / 3; return f; };

// ---------------------------------------------------------------- the worker (forestry gear)
const HIP = 0.88;
const _lean = new THREE.Matrix4(), _tmp = new THREE.Matrix4();
const upper = (p, out, m) => out.multiplyMatrices(pivot(_lean, 0, HIP, 0, p.lean, 0, 0, 0, -HIP, 0), m);
const leg = (sx, oy, oz = 0) => (p, o) => pivot(o, sx * 0.1, HIP, 0, sx * Math.sin(p.ph) * 0.55 * p.amp, 0, 0, 0, oy, oz);
const arm = (sx, oy, oz = 0) => (p, o) => upper(p, o, pivot(_tmp, sx * 0.27, 1.42, 0, p.arm + sx * Math.sin(p.ph) * 0.5 * p.amp, 0, sx * 0.07, 0, oy, oz));
const fixed = (m) => (p, o) => upper(p, o, m);
const worker = new Kind([
  { geo: RB(0.15, 0.84, 0.15, 0.05), color: C.navy, local: leg(-1, -0.42) },
  { geo: RB(0.15, 0.84, 0.15, 0.05), color: C.navy, local: leg(1, -0.42) },
  { geo: RB(0.16, 0.24, 0.05, 0.02), color: C.orange, local: leg(-1, -0.3, 0.07) },       // chainsaw-trouser panels
  { geo: RB(0.16, 0.24, 0.05, 0.02), color: C.orange, local: leg(1, -0.3, 0.07) },
  { geo: RB(0.17, 0.11, 0.27, 0.04), color: C.tyre, local: leg(-1, -0.85, 0.05) },
  { geo: RB(0.17, 0.11, 0.27, 0.04), color: C.tyre, local: leg(1, -0.85, 0.05) },
  { geo: RB(0.44, 0.62, 0.27, 0.08), color: C.greenDeep, local: fixed(TRS(0, 1.18, 0)) }, // forestry jacket
  { geo: RB(0.45, 0.07, 0.28, 0.02), color: C.orange, local: fixed(TRS(0, 1.3, 0)) },    // hi-vis band
  { geo: RB(0.13, 0.6, 0.13, 0.05), color: C.greenDeep, local: arm(-1, -0.28) },
  { geo: RB(0.13, 0.6, 0.13, 0.05), color: C.greenDeep, local: arm(1, -0.28) },
  { geo: RB(0.14, 0.13, 0.14, 0.05), color: C.orange, local: arm(-1, -0.62) },            // gloves
  { geo: RB(0.14, 0.13, 0.14, 0.05), color: C.orange, local: arm(1, -0.62) },
  { geo: RB(0.22, 0.25, 0.22, 0.08), color: C.skin, local: fixed(TRS(0, 1.62, 0)) },
  { geo: RB(0.28, 0.15, 0.3, 0.07), color: C.orange, local: fixed(TRS(0, 1.76, 0)) },     // forestry helmet
  { geo: RB(0.07, 0.12, 0.12, 0.04), color: C.navy, local: fixed(TRS(-0.15, 1.63, 0)) },  // ear defenders
  { geo: RB(0.07, 0.12, 0.12, 0.04), color: C.navy, local: fixed(TRS(0.15, 1.63, 0)) },
  { geo: RB(0.27, 0.09, 0.02, 0.01), color: C.steel, local: fixed(TRS(0, 1.78, 0.16, -0.5)) }, // mesh visor (raised)
], 1);
const YAW_X = faceY(1, 0), YAW_NX = faceY(-1, 0), YAW_Z = faceY(0, 1);
function walk(x0, z0, x1, z1, ry, u) {
  return { x: lerp(x0, x1, smooth(u)), z: lerp(z0, z1, smooth(u)), ry, ph: smooth(u) * 2 * Math.hypot(x1 - x0, z1 - z0) / 0.35, amp: bump(0, 1, u), lean: 0.08 };
}
function workerPose(t) {
  const k = Math.floor((t - T0) / PC), tau = t - pickT(k);
  const atA = { x: WORK.xA, z: WORK.zA, ry: YAW_X, ph: 0, amp: 0, lean: 0, arm: -0.1 };
  if (t < T0 || k >= NLOG) return { ...atA, arm: -0.1 + 0.05 * Math.sin(TAU * t / 4) };
  const carry = -1.25, push = -1.45;
  if (tau < 0.2) return { ...atA, lean: 0.75 * bump(0, 0.2, tau), arm: lerp(-0.6, carry, smooth(tau / 0.2)) };
  if (tau < 0.3) return { ...atA, ry: lerp(YAW_X, YAW_X - Math.PI, smooth((tau - 0.2) / 0.1)), arm: carry };
  if (tau < 0.6) return { ...walk(WORK.xA, WORK.zA, WORK.xP, WORK.zP, YAW_NX, (tau - 0.3) / 0.3), arm: carry };
  if (tau < 0.72) return { x: WORK.xP, z: WORK.zP, ry: YAW_NX, ph: 0, amp: 0, lean: 0.5 * bump(0.6, 0.72, tau), arm: lerp(carry, -0.6, smooth((tau - 0.6) / 0.12)) };
  if (tau < PUSH0) {
    const u = (tau - 0.72) / (PUSH0 - 0.72);
    return { ...walk(WORK.xP, WORK.zP, WORK.xB, WORK.zB, lerp(YAW_NX, YAW_Z, smooth(u * 1.5)), u), arm: lerp(-0.6, push + 0.3, smooth(u)) };
  }
  const end = PUSH0 + PUSH_GAP * SEGS;
  if (tau < end) {
    const j = Math.floor((tau - PUSH0) / PUSH_GAP), s = PUSH0 + PUSH_GAP * j;
    const f = feed(k, t);
    return { x: WORK.xB, z: WORK.zB + f, ry: YAW_Z, ph: f * 18, amp: 0.4 * bump(s, s + PUSH_LEN, tau), lean: 0.35 * bump(s - 0.05, s + PUSH_LEN + 0.05, tau), arm: push + 0.3 * (1 - bump(s, s + PUSH_LEN, tau)) };
  }
  const u = (tau - end) / (PC - end);
  return { ...walk(WORK.xB, WORK.zB + 1, WORK.xA, WORK.zA, lerp(YAW_Z, YAW_X, smooth(u * 2)), u), arm: -0.1 };
}
worker.add(0.45, workerPose);
worker.finalize();
const handPos = (w) => ({ x: w.x + Math.sin(w.ry) * 0.42, y: 1.0 - 0.35 * w.lean, z: w.z + Math.cos(w.ry) * 0.42 });

// ---------------------------------------------------------------- the 1 m birch log stack
{
  const g = new THREE.Group();
  for (const z of [-2.0, -1.3]) g.add(mesh(RB(1.3, 0.08, 0.1, 0.03), C.woodDark, 2.55, 0.04, z));
  for (const x of [1.92, 3.17]) for (const z of [-2.05, -1.25]) g.add(mesh(RB(0.07, 1.0, 0.07, 0.025), C.woodDark, x, 0.5, z));
  addGroup(g, 0.1);
  // chopping block with an axe, and a red jerry can
  const b = new THREE.Group();
  b.add(mesh(RB(0.42, 0.45, 0.42, 0.12), C.woodDark, 0, 0.225, 0));
  b.add(mesh(RB(0.36, 0.02, 0.36, 0.01), C.wood, 0, 0.455, 0));
  b.add(mesh(RB(0.04, 0.6, 0.04, 0.015), C.woodDark, 0.05, 0.72, 0, 0, 0, -0.35));
  b.add(mesh(RB(0.2, 0.1, 0.03, 0.012), C.steel, -0.05, 0.47, 0, 0, 0, -0.35));
  addGroup(b, 0.3, 3.5, 0, 2.6);
  const can = new THREE.Group();
  can.add(mesh(RB(0.34, 0.45, 0.17, 0.05), C.mfRed, 0, 0.225, 0));
  can.add(mesh(RB(0.2, 0.05, 0.05, 0.02), C.mfRed, 0, 0.48, 0));
  addGroup(can, 0.32, -0.5, 0, 1.0, 0.4);
}
const slot = (k) => {
  const row = 4 - Math.floor(k / 6), col = k % 6;
  return { x: 2.02 + col * 0.17 + (row % 2) * 0.085, y: 0.16 + row * 0.148, z: WORK.zA, row };
};
const logSegs = new Kind([
  { geo: RB(1 / 3 - 0.004, LOG_D, LOG_D, 0.075), color: C.birch, local: new THREE.Matrix4() },
  { geo: RB(0.05, 0.03, 0.1, 0.012), color: C.navy, local: TRS(0.05, 0.075, 0.01) },          // birch bark marks
  { geo: RB(0.07, 0.1, 0.025, 0.01), color: C.navy, local: TRS(-0.08, 0.0, 0.076) },
  { geo: RB(0.012, 0.13, 0.13, 0.05), color: C.wood, local: TRS(1 / 6, 0, 0) },              // cut faces
  { geo: RB(0.012, 0.13, 0.13, 0.05), color: C.wood, local: TRS(-1 / 6, 0, 0) },
], NLOG * SEGS);
for (let k = 0; k < NLOG; k++) {
  const sl = slot(k), roll = rr(0, TAU);
  for (let j = 0; j < SEGS; j++) {
    const off = -(j - 1) / 3;   // world z offset along the log (segment 0 = front, nearest the blade)
    logSegs.add(0.3 + sl.row * 0.04 + rr(0, 0.03), (t) => {
      const base = { ry: Math.PI / 2, rx: roll };
      if (t < pickT(k)) return { ...base, x: sl.x, y: sl.y, z: sl.z + off };
      if (t < placeT(k)) {
        const w = workerPose(t), h = handPos(w), tau = t - pickT(k);
        let x = h.x, y = h.y, z = h.z;
        if (tau < 0.2) { const u = smooth(tau / 0.2); x = lerp(sl.x, h.x, u); y = lerp(sl.y, h.y, u) + 0.15 * bump(0, 1, u); z = lerp(sl.z, h.z, u); }
        else if (tau > 0.6) { const u = smooth((tau - 0.6) / 0.12); x = lerp(h.x, MACH_X, u); y = lerp(h.y, TROUGH.y, u); z = lerp(h.z, TROUGH.z, u); }
        return { ...base, x, y, z: z + off };
      }
      if (t < chopT(k, j)) return { ...base, x: MACH_X, y: TROUGH.y, z: TROUGH.z + off + feed(k, t) };
      return { x: 0, z: 0, s: 0 };
    });
  }
}
logSegs.finalize();

// ---------------------------------------------------------------- each chop throws two halves sideways onto the pile
// Rest spots: piece n lies on the surface of a cone scaled by (n/N)^(1/3), so the pile grows self-similarly.
const spots = [];
for (let n = 0; n < NPIECE; n++) {
  const s = Math.cbrt((n + 1) / NPIECE), a = rr(0, TAU), rho = Math.sqrt(rr(0.02, 1));
  const r = PILE.R * s * rho, y = PILE.H * s * (1 - rho) + 0.04;
  spots.push({ x: PILE.x + r * Math.cos(a), y, z: PILE.z + r * Math.sin(a), ry: rr(0, TAU), rx: rr(-0.4, 0.4), rz: rr(-0.4, 0.4) });
}
const pieces = new Kind([
  { geo: RB(0.32, 0.075, 0.15, 0.025), color: 'inst', slot: 'w', local: new THREE.Matrix4() },
  { geo: RB(0.3, 0.02, 0.13, 0.008), color: C.birch, local: TRS(0, 0.036, 0) },
], NPIECE);
const landT = [];
for (let k = 0; k < NLOG; k++) for (let j = 0; j < SEGS; j++) for (let h = 0; h < HALVES; h++) {
  const n = (k * SEGS + j) * HALVES + h, sp = spots[n], c = chopT(k, j), spin = rr(2, 4) * (h ? 1 : -1);
  const x0 = MACH_X + (h ? 0.04 : -0.04), z0 = SAW_Z + 1 / 6, rz0 = h ? Math.PI / 2 : -Math.PI / 2;
  landT.push(c + FLY);
  pieces.add(0.4 + rr(0, 0.25), (t) => {
    if (t < c) return { x: 0, z: 0, s: 0 };
    if (t < c + FLY) {
      const u = (t - c) / FLY;
      return {
        x: lerp(x0, sp.x, u), y: lerp(TROUGH.y, sp.y, u) + 0.45 * Math.sin(Math.PI * u), z: lerp(z0, sp.z, u),
        ry: lerp(Math.PI / 2, sp.ry, u), rx: lerp(0, sp.rx, u) + spin * Math.sin(Math.PI * u), rz: lerp(rz0, sp.rz, u),
      };
    }
    return sp;
  }, { w: [C.wood, 0xe9cf9e, 0xdcb97f, 0xeed8ad][n % 4] });
}
pieces.finalize();
const LANDS = landT.slice().sort((a, b) => a - b);
// pile core so the inside of the heap reads solid as it grows
const landedCont = (t) => { let n = 0; for (const x of landT) n += clamp01((t - (x - FLY)) / FLY); return n; };
const coreGeo = new THREE.ConeGeometry(1, 1, 28, 1).translate(0, 0.5, 0);
const core = new THREE.Mesh(coreGeo, MAT(C.woodDark, { roughness: 0.9 }));
core.receiveShadow = true; core.castShadow = true;
scene.add(core);
// wood chips spray at each chop
const dust = new Kind([{ geo: RB(0.05, 0.05, 0.05, 0.02), color: C.wood, local: new THREE.Matrix4(), shadow: false }], 24);
for (let i = 0; i < 18; i++) {
  const vx = rr(0.4, 1.4), vy = rr(0.4, 1.4), vz = rr(-0.4, 0.4);
  dust.add(0.5, (t) => {
    const a = t - lastBefore(CHOPS, t) - i * 0.012;
    if (a < 0 || a > 0.6) return { x: 0, z: 0, s: 0 };
    return { x: MACH_X + 0.1 + vx * a, y: TROUGH.y + 0.1 + vy * a - 4.9 * a * a, z: SAW_Z + vz * a, s: 1 - a / 0.6, ry: i };
  });
}
dust.finalize();

// ---------------------------------------------------------------- trees, rocks, grass
const swayP = L / 16;
const birch = new Kind([
  { geo: RB(0.14, 2.2, 0.14, 0.05), color: C.birch, local: TRS(0, 1.1, 0) },
  { geo: RB(0.15, 0.05, 0.15, 0.02), color: C.navy, local: TRS(0, 0.7, 0) },
  { geo: RB(0.15, 0.04, 0.15, 0.02), color: C.navy, local: TRS(0, 1.25, 0) },
  { geo: RB(1.0, 0.8, 1.0, 0.32), color: C.green, local: TRS(0, 1.9, 0) },
  { geo: RB(0.7, 0.6, 0.7, 0.26), color: C.greenDeep, local: TRS(0.12, 2.4, -0.08, 0, 0.6, 0) },
], 12);
const spruce = new Kind([
  { geo: RB(0.16, 0.6, 0.16, 0.05), color: C.woodDark, local: TRS(0, 0.3, 0) },
  ...[0, 1, 2, 3].map((i) => ({ geo: RB(1.2 - i * 0.26, 0.42, 1.2 - i * 0.26, 0.12), color: i % 2 ? C.tealDeep : C.greenDeep, local: TRS(0, 0.65 + i * 0.42, 0, 0, i * 0.4, 0) })),
], 12);
[[-4.4, -4.2, 0], [-3.0, -4.3, 1], [-4.4, 1.6, 1], [-4.3, 3.4, 0], [-4.4, -0.8, 0], [3.6, -4.2, 0], [1.0, -4.3, 1], [-1.6, -4.4, 0], [2.6, -4.3, 1], [-2.2, -3.4, 1]]
  .forEach(([x, z, type], i) => {
    const s = rr(0.8, 1.15), ph = rr(0, TAU), ry = rr(0, TAU);
    (type ? spruce : birch).add(0.25 + 0.03 * i, (t) => ({ x, y: 0, z, ry, s, rx: 0.025 * Math.sin(TAU * t / swayP + ph), rz: 0.025 * Math.cos(TAU * t / swayP + ph) }));
  });
const rocks = new Kind([{ geo: RB(0.4, 0.26, 0.32, 0.1), color: C.steel, local: TRS(0, 0.1, 0) }], 10);
const grass = new Kind([
  { geo: RB(0.05, 0.22, 0.05, 0.02), color: C.green, local: TRS(0, 0.1, 0, 0, 0, 0.25) },
  { geo: RB(0.05, 0.18, 0.05, 0.02), color: C.greenDeep, local: TRS(0.05, 0.08, 0.03, 0, 0, -0.3) },
  { geo: RB(0.05, 0.2, 0.05, 0.02), color: C.green, local: TRS(-0.03, 0.09, -0.04, 0.3, 0, 0) },
], 70);
const keepOut = [[-4.5, 0.8, -1.6, 0.6], [-0.2, 1.4, -2.4, 0.0], [1.3, 3.4, -2.4, -0.9], [0.6, 3.3, -0.5, 2.2], [3.2, 3.8, 2.3, 2.9], [-0.8, -0.2, 0.7, 1.3]];
const free = (x, z) => !keepOut.some(([x0, x1, z0, z1]) => x > x0 && x < x1 && z > z0 && z < z1);
for (let n = 0, tries = 0; n < 60 && tries < 2000; tries++) {
  const x = SCX + rr(-HALF + 0.3, HALF - 0.3), z = SCZ + rr(-HALF + 0.3, HALF - 0.3);
  if (!free(x, z)) continue;
  const ph = rr(0, TAU), ry = rr(0, TAU);
  grass.add(0.35 + rr(0, 0.25), (t) => ({ x, y: 0, z, ry, rz: 0.06 * Math.sin(TAU * t / swayP + ph) }));
  n++;
}
for (let n = 0, tries = 0; n < 6 && tries < 500; tries++) {
  const x = SCX + rr(-HALF + 0.5, HALF - 0.5), z = SCZ + rr(-HALF + 0.5, HALF - 0.5);
  if (!free(x, z)) continue;
  rocks.add(0.3 + rr(0, 0.2), { x, y: 0, z, ry: rr(0, TAU), s: rr(0.6, 1.3) });
  n++;
}
for (const k of [birch, spruce, rocks, grass]) k.finalize();

// ---------------------------------------------------------------- shadow camera tightly fitted
{
  sun.updateMatrixWorld();
  const cam = sun.shadow.camera;
  cam.position.copy(sun.position); cam.lookAt(sun.target.position); cam.updateMatrixWorld();
  const inv = cam.matrixWorldInverse, box = new THREE.Box3();
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) for (const y of [-1.5, 4.0]) box.expandByPoint(new THREE.Vector3(SCX + sx * HALF, y, SCZ + sz * HALF).applyMatrix4(inv));
  cam.left = box.min.x - 0.2; cam.right = box.max.x + 0.2; cam.bottom = box.min.y - 0.2; cam.top = box.max.y + 0.2;
  cam.near = Math.max(0.1, -box.max.z - 0.5); cam.far = -box.min.z + 0.5;
  cam.updateProjectionMatrix();
}

// ---------------------------------------------------------------- camera: slow gentle swing (no full turn), fitted to ~80% of frame
const ELEV = THREE.MathUtils.degToRad(30), A0 = THREE.MathUtils.degToRad(45), SWING = THREE.MathUtils.degToRad(17), FILL = 0.8;
const TARGET = new THREE.Vector3(SCX, 1.0, SCZ), _target = new THREE.Vector3();
const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
const _dir = new THREE.Vector3(), _right = new THREE.Vector3(), _up = new THREE.Vector3(), _rel = new THREE.Vector3();
function fitDistance(dir, target) {
  let D = 0;
  for (const p of fitPoints) {
    _rel.subVectors(p, target);
    const ext = Math.max(Math.abs(_rel.dot(_right)), Math.abs(_rel.dot(_up)));
    D = Math.max(D, _rel.dot(dir) + ext / (FILL * tanHalf));
  }
  return D;
}
function frameView(dir) {
  _right.crossVectors(new THREE.Vector3(0, 1, 0), dir).normalize();
  _up.crossVectors(dir, _right);
  _target.copy(TARGET);
  let D = fitDistance(dir, _target);
  for (let it = 0; it < 4; it++) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of fitPoints) {
      _rel.subVectors(p, _target);
      const depth = D - _rel.dot(dir), sx = _rel.dot(_right) / depth, sy = _rel.dot(_up) / depth;
      x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
    }
    _target.addScaledVector(_right, (x0 + x1) / 2 * D).addScaledVector(_up, (y0 + y1) / 2 * D);
    D = fitDistance(dir, _target);
  }
  return D;
}
function updateCamera(t) {
  const u = t / L;
  const a = A0 + SWING * Math.sin(TAU * u);                   // one slow swing out and back per loop
  _dir.set(Math.cos(ELEV) * Math.cos(a), Math.sin(ELEV), Math.cos(ELEV) * Math.sin(a));
  const push = 1 - 0.04 * (1 - Math.cos(TAU * u)) / 2;        // gentle push-in and pull-out
  const D = frameView(_dir) * push;
  camera.position.copy(_target).addScaledVector(_dir, D);
  camera.lookAt(_target);
}

small.width = Math.ceil(CARD.w / 8); small.height = Math.ceil(CARD.h / 8);

const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const countIf = (arr, t) => { let n = 0; for (const x of arr) if (x <= t) n++; return n; };
const LOG_DONE = Array.from({ length: NLOG }, (_, k) => chopT(k, SEGS - 1));
const PICKS = Array.from({ length: NLOG }, (_, k) => pickT(k) + 0.1);
function stats(t) {
  const down = t > LIVE_END ? 1 - smooth(t - LIVE_END) : 1;     // count back down while dismantling
  const up = smooth(t / BUILD_END);
  return {
    logs: Math.round(countIf(LOG_DONE, t) * down),
    chops: Math.round(countIf(CHOPS, t) * down),
    pieces: Math.round(countIf(LANDS, t) * down),
    stacked: (NLOG - countIf(PICKS, t)) / NLOG * STACKED_M3 * up * down,
    loose: landedCont(t) / NPIECE * LOOSE_M3 * down,
  };
}
const m3 = (v) => v.toFixed(2) + ' m³';
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function drawCard(t, src) {
  const { x, y, w, h, r } = CARD;
  if (hasFilter) {
    bctx.filter = 'blur(10px)';
    bctx.drawImage(src, x - 20, y - 20, w + 40, h + 40, -20, -20, w + 40, h + 40);
    bctx.filter = 'none';
  } else {
    sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(src, x, y, w, h, 0, 0, small.width, small.height);
    bctx.imageSmoothingQuality = 'high';
    bctx.drawImage(small, 0, 0, w, h);
  }
  ctx.save();
  ctx.shadowColor = 'rgba(28,37,65,0.18)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  roundRect(ctx, x, y, w, h, r); ctx.fillStyle = 'rgba(250,248,243,0.4)'; ctx.fill();
  ctx.restore();
  ctx.save();
  roundRect(ctx, x, y, w, h, r); ctx.clip();
  ctx.drawImage(blurCanvas, x, y);
  ctx.fillStyle = 'rgba(250,248,243,0.55)'; ctx.fillRect(x, y, w, h);
  ctx.restore();
  roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, r);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1; ctx.stroke();

  const s = stats(t);
  const pulse = 0.5 + 0.5 * Math.cos(TAU * 20 * t / L);
  ctx.fillStyle = '#ff7a1a';
  ctx.globalAlpha = 0.35 + 0.65 * pulse;
  ctx.beginPath(); ctx.arc(x + 20, y + 25, 4.5, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#1c2541'; ctx.textBaseline = 'middle';
  ctx.font = `700 15px ${FONT}`;
  ctx.fillText('Pilkekone · Firewood Count', x + 32, y + 25);
  [[`${s.logs}/${NLOG}`, 'Logs split', 16], [String(s.chops), 'Chops', 102], [String(s.pieces), 'Pieces', 166]].forEach(([v, label, ox]) => {
    ctx.fillStyle = '#1c2541'; ctx.font = `700 19px ${FONT}`;
    ctx.fillText(v, x + ox, y + 60);
    ctx.fillStyle = 'rgba(28,37,65,0.62)'; ctx.font = `500 11px ${FONT}`;
    ctx.fillText(label, x + ox, y + 80);
  });
  const barW = w - 32, max = LOOSE_M3;
  [['1 m logs, stacked', s.stacked, '#17a3a0', 104], ['Split, loose pile', s.loose, '#ff7a1a', 136]].forEach(([label, v, col, oy]) => {
    ctx.fillStyle = '#1c2541'; ctx.font = `500 11px ${FONT}`;
    ctx.textAlign = 'left'; ctx.fillText(label, x + 16, y + oy);
    ctx.font = `700 11px ${FONT}`; ctx.textAlign = 'right'; ctx.fillText(m3(v), x + w - 16, y + oy);
    ctx.textAlign = 'left';
    roundRect(ctx, x + 16, y + oy + 10, barW, 6, 3); ctx.fillStyle = 'rgba(28,37,65,0.1)'; ctx.fill();
    if (v > 0.005) { roundRect(ctx, x + 16, y + oy + 10, barW * v / max, 6, 3); ctx.fillStyle = col; ctx.fill(); }
  });
  ctx.fillStyle = 'rgba(28,37,65,0.62)'; ctx.font = `500 11px ${FONT}`;
  ctx.fillText(`Split wood takes +${Math.round((LOOSE_M3 / STACKED_M3 - 1) * 100)}% more space`, x + 16, y + 168);
}

// ---------------------------------------------------------------- frame
function renderFrame(t) {
  for (const g of groups) {
    const e = envelope(t, g.delay);
    g.obj.visible = e.s > 1e-3;
    g.obj.scale.setScalar(Math.max(e.s, 1e-3));
    g.obj.position.y = g.y + e.dy + (g.wobble ? g.wobble(t) : 0);
  }
  const ce = envelope(t, 0.62), cs = Math.cbrt(landedCont(t) / NPIECE) * 0.94 * ce.s;
  core.visible = cs > 1e-3;
  core.scale.set(PILE.R * cs, PILE.H * cs, PILE.R * cs);
  core.position.set(PILE.x, ce.dy, PILE.z);
  updateKinds(t);
  updateCamera(t);
  composer.render();
  ctx.drawImage(renderer.domElement, 0, 0, SIZE, SIZE);
  drawCard(t, view);
}

// ---------------------------------------------------------------- loop & recording
let start = performance.now();
let recorder = null, recEnd = 0;
const recEl = document.getElementById('rec');
function tick(now) {
  if (recorder && now >= recEnd) { recorder.stop(); recorder = null; }
  const elapsed = Math.max(0, now - start) / 1000;
  renderFrame(elapsed % L);
  requestAnimationFrame(tick);
}
function startRecording() {
  if (recorder) return;
  const stream = view.captureStream(60);
  const type = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 12_000_000 });
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach((tr) => tr.stop());
    recEl.style.display = 'none';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = 'firewood-loop.webm';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  // restart the loop so the recording begins exactly at t = 0 and spans one loop
  start = performance.now();
  recEnd = start + L * 1000;
  renderFrame(0);
  rec.start();
  recorder = rec;
  recEl.style.display = 'flex';
}
addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') startRecording(); });
window.__renderAt = renderFrame;   // handy for checking individual frames
requestAnimationFrame(tick);
</script>
